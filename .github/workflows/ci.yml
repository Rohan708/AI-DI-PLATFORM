name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest  # has Docker, so testcontainers integration tests run here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy

      # GitHub sets CI=true, so integration tests FAIL (not skip) if Docker is missing.
      - name: Tests
        run: pytest

  docker-image:
    # The self-hosted image must always build (Stage 4.1). Not pushed anywhere yet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t lumida:ci .
      - name: Smoke test
        run: docker run --rm lumida:ci version
