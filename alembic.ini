# Alembic config for the metadata store.
# The database URL is NOT set here: migrations/env.py reads AIDE_DATABASE_URL
# (via ai_data_engineer.config) unless a caller sets sqlalchemy.url programmatically.

[alembic]
script_location = %(here)s/src/ai_data_engineer/migrations
file_template = v%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
