[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumida"
dynamic = ["version"]
description = "Database-agnostic, AI-assisted anomaly detection: discovers structure and hidden relationships, learns normal, finds anomalies with evidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "sqlglot>=25",
    "pyyaml>=6",  # dbt schema.yml import (Stage 2.7)
    "tzdata",  # time zones for schedules on systems without one (Windows, slim images)
]

[project.optional-dependencies]
# Fake-data generation for the test lab / demo database.
lab = ["faker>=30"]
# Database drivers for the generic SQL adapter (Stage 3). Install only what you use.
mysql = ["pymysql>=1.1"]
sqlserver = ["pyodbc>=5.1"]  # also needs Microsoft's "ODBC Driver 18 for SQL Server"
oracle = ["oracledb>=2.0"]
snowflake = ["snowflake-sqlalchemy>=1.6"]
dev = [
    "faker>=30",
    "pymysql>=1.1",
    "pytest>=8.2",
    "types-PyYAML",
    "testcontainers[postgres,mysql]>=4.15",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
lumida = "lumida.cli:main"

[tool.setuptools.dynamic]
version = { attr = "lumida.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Migrations ship with the package so `lumida serve` can upgrade the store anywhere.
lumida = ["py.typed", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "N",       # naming
    "RUF",     # ruff-specific
    "PT",      # pytest style
    "DTZ",     # naive datetimes / datetime.utcnow are errors
    "S",       # bandit: hardcoded secrets, unsafe calls
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert + fake passwords are fine in tests
# The test lab needs seeded, reproducible pseudo-randomness on purpose (not security).
"src/lumida/lab/**" = ["S311"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "faker.*", "sqlglot.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Builds SQLAlchemy dialects and dialect types directly; their constructors are untyped.
module = ["test_sql_dialect_logic", "test_context_logic"]
disallow_untyped_calls = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: needs Docker (testcontainers); auto-applied to tests/integration/",
]
