[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-engineer"
dynamic = ["version"]
description = "Database-agnostic, AI-assisted anomaly detection: discovers structure and hidden relationships, learns normal, finds anomalies with evidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "sqlglot>=25",
]

[project.optional-dependencies]
# Fake-data generation for the test lab / demo database.
lab = ["faker>=30"]
dev = [
    "faker>=30",
    "pytest>=8.2",
    "testcontainers[postgres]>=4.15",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
aide = "ai_data_engineer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ai_data_engineer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_data_engineer = ["py.typed"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "N",       # naming
    "RUF",     # ruff-specific
    "PT",      # pytest style
    "DTZ",     # naive datetimes / datetime.utcnow are errors
    "S",       # bandit: hardcoded secrets, unsafe calls
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert + fake passwords are fine in tests
# The test lab needs seeded, reproducible pseudo-randomness on purpose (not security).
"src/ai_data_engineer/lab/**" = ["S311"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "faker.*", "sqlglot.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: needs Docker (testcontainers); auto-applied to tests/integration/",
]
